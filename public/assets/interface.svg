<svg xmlns="http://w3.org" viewBox="0 0 800 120" width="100%" height="100">
  <defs>
    <!-- Cyan/Neon Green Glow Filters for Cyberpunk Accents -->
    <filter id="obsidian-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Complete Absolute Black Background Grid Matrix Layer -->
  <rect width="800" height="120" fill="#000000"/>
  <path d="M0,20 H800 M0,60 H800 M0,100 H800 M100,0 V120 M300,0 V120 M500,0 V120 M700,0 V120" stroke="#0A0A0C" stroke-width="1"/>

  <!-- Multi-Layer Anonymity Circuit Highway Path Vectors -->
  <g stroke="#00FF66" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 80 60 L 220 60" stroke-dasharray="5,5" />
    <path d="M 260 60 L 400 60" stroke-dasharray="5,5" />
    <path d="M 440 60 L 580 60" stroke-dasharray="5,5" />
    <path d="M 620 60 L 720 60" stroke-dasharray="5,5" />
  </g>

  <!-- Live Intercepting Nodes Components (Client to Endpoint Destination) -->
  <!-- Client Device Node -->
  <circle cx="60" cy="60" r="14" fill="#000" stroke="#6E6E77" stroke-width="2"/>
  <text x="60" y="64" fill="#6E6E77" font-family="monospace" font-size="10" text-anchor="middle">CLI</text>
  
  <!-- Circuit Guard Node -->
  <circle cx="240" cy="60" r="16" fill="#000" stroke="#00FF66" stroke-width="2" filter="url(#obsidian-glow)"/>
  <text x="240" y="64" fill="#00FF66" font-family="monospace" font-size="10" text-anchor="middle">GRD</text>

  <!-- Middle Proxy Relay Node -->
  <circle cx="420" cy="60" r="16" fill="#000" stroke="#00FF66" stroke-width="2" filter="url(#obsidian-glow)"/>
  <text x="420" y="64" fill="#00FF66" font-family="monospace" font-size="10" text-anchor="middle">RLY</text>

